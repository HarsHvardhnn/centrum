server {
    listen 80;
    server_name centrummedyczne7.pl www.centrummedyczne7.pl;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name centrummedyczne7.pl www.centrummedyczne7.pl;

    ssl_certificate /etc/letsencrypt/live/centrummedyczne7.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centrummedyczne7.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SEO and security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Increase timeouts for API calls
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # CRITICAL: Don't cache error responses (4xx, 5xx)
    proxy_cache_valid 404 0s;
    proxy_cache_valid 500 502 503 504 0s;
    proxy_no_cache $status_404 $status_500 $status_502 $status_503 $status_504;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Critical headers for proper redirect handling
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keep existing settings
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Don't cache HTML responses to ensure fresh content
        proxy_cache_bypass 1;
        add_header X-Cache-Status "BYPASS";
    }

    # Handle dynamic routes with no caching to prevent stale content
    location ~ ^/(aktualnosci|poradnik|uslugi|lekarze)/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No caching for dynamic content
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Caching for static assets only
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        proxy_cache_bypass $http_upgrade;
    }

    # Handle robots.txt and sitemap.xml with shorter cache
    location ~* \.(xml|txt)$ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}