server {
    listen 80;
    server_name centrummedyczne7.pl www.centrummedyczne7.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name centrummedyczne7.pl www.centrummedyczne7.pl;
    
    ssl_certificate /etc/letsencrypt/live/centrummedyczne7.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centrummedyczne7.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SEO and security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase timeouts for API calls
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    
    # Disable buffering for better real-time responses
    proxy_buffering off;
    proxy_request_buffering off;

    # Main location block - CRITICAL: Pass User-Agent for bot detection
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # CRITICAL HEADERS - Must include User-Agent for SEO bot detection
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header User-Agent $http_user_agent;  # CRITICAL FOR SEO
        
        # Disable caching for HTML pages to ensure fresh SEO content
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Static assets - Allow caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header User-Agent $http_user_agent;
        
        # Cache static assets
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Handle robots.txt and sitemap.xml with shorter cache
    location ~* \.(xml|txt)$ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header User-Agent $http_user_agent;
        
        # Shorter cache for sitemap and robots.txt
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }
    
    # Handle API routes if needed (forward to backend)
    location /api/ {
        proxy_pass https://backend.centrummedyczne7.pl/;
        proxy_set_header Host backend.centrummedyczne7.pl;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        
        # No caching for API
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

